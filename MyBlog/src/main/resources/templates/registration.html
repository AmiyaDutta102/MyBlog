 <head th:replace="/fragments/head :: head">
<body>

	<div class="container">
 <header th:replace="/fragments/header :: header">
  </div>
	<div class="container">
		<div class="row">
			<div class="col-md-6 col-md-offset-3">

				<!-- message success -->
				<div th:if="${param.success}">
					<div class="alert alert-info">Success!</div>
				</div>

				<!-- Registration form -->
				<form th:action="@{/registration}" th:object="${account}" method="POST">
					<div class="form-group">
						<label class="control-label" for="firstName">First Name</label> <input
							id="firstName" name="firstName" th:field="*{firstName}"
							class="form-control" placeholder="Enter First Name" autofocus="autofocus" required/>
							<p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="alert alert-danger" role="alert">First name error!</p>
					</div>

					<div class="form-group">
						<label class="control-label" for="lastName">Last Name</label> <input
							id="lastName" name="lastName" th:field="*{lastName}"
							class="form-control" placeholder="Enter Last Name" />
							
					</div>
					<div class="form-group">
						<label class="control-label" for="email">Email</label> 
						<input id="email" name="email" type="email" th:field="*{email}" class="form-control" placeholder="Enter email" />
						<p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="alert alert-danger" role="alert">Email error!</p>
					</div>
					<div class="form-group">
						<label class="control-label" for="password">Password</label> <input
							 id="password" name="password" type="password" th:field="*{password}"
							class="form-control" placeholder="Enter password" />
							<p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="alert alert-danger" role="alert">Password error!</p>
					</div>
					<div class="form-group">
						<label class="control-label" for="dateOfBirth">DOB</label> <input
							id="dateOfBirth" name="dateOfBirth" type="date" th:field="*{dateOfBirth}"
							class="form-control" placeholder="Enter DOB" required/>
							<p th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}" class="alert alert-danger" role="alert">DOB error!</p>
					</div>
					<div class="form-group">
						<label class="control-label" for="gender">Gender</label> 
						<select id="gender" th:field="*{gender}" class="form-control" >
							<option value="Male">Male</option>
							<option value="Female">Female</option>
						</select>
							<p th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" class="alert alert-danger" role="alert">Gender error!</p>
					</div>
					<div class="box-footer">
						<button type="submit" class="btn btn-success">Submit</button>
						<span>Already Register? <a href="/" th:href="@{/login}">Login
								here</a></span>
					</div>
				</form>
			</div>
		</div>
	</div>
	
	<footer th:replace="/fragments/footer :: footer">
	
</body>
</html>
