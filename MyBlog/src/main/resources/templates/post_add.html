  <head th:replace="~{fragments/head :: head}">

<body>

  <div class="container">

    <header th:replace="~{fragments/header :: header}">
  </div>
  
 <section>
    <div class="container">
      <div class="row">
        <div class="col-md-6">
          <div class="form_container">
            <h3> Add post </h3>
            <form action="#"
                th:action="@{/posts/add}"
                th:object="${post}"
                method="post">
              <div class="form-group">
                <input type="hidden" id="account" name="account" th:field="*{account}"/>
                <input id="title" th:field="*{title}" name="title" type="text" class="form-control" placeholder="title"/>
                <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="alert alert-danger" role="alert">title Error</p>
              </div>
              <div class="form-group">
                <textarea id="editor" th:field="*{body}" name="body"></textarea>
                <p th:if="${#fields.hasErrors('body')}" th:errors="*{body}" class="alert alert-danger" role="alert">title Error</p>
              </div>
                <button type="submit"  class="btn btn-primary">
                  Add post
                </button>
            </form>
          </div>
        </div>
    </div>
  </section>
  <!-- end book section -->
  <footer th:replace="/fragments/footer :: footer">
  
</body>

</html>
