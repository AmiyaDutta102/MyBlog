<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
    <meta name="generator" content="Hugo 0.84.0">
    <title>Signin</title>
    

    <!-- Bootstrap core CSS -->
	<link type="text/css" th:href="@{/resources/static/css/bootstrap.min.css}" rel="stylesheet">

    <style>
      .bd-placeholder-img {
        font-size: 1.125rem;
        text-anchor: middle;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
      }

      @media (min-width: 768px) {
        .bd-placeholder-img-lg {
          font-size: 3.5rem;
        }
      }
    </style>

    
    <!-- Custom styles for this template -->
    <link type="text/css" th:href="@{/resources/static/css/signin.css}" rel="stylesheet">
  </head>
  <body class="text-center">
    
<main class="form-signin">
  <form th:action="@{/login}" method="post">
    <img class="mb-4" th:src="@{/resources/static/img/myblog.png}" alt="" width="72" height="72">
    <h1 class="h3 mb-3 fw-normal">Please sign in</h1>

	<!-- error message -->
	<div th:if="${param.error}">
		<span class="alert alert-danger">Invalid username and password!</span>
	</div>
	<!-- logout message -->
	<div th:if="${param.logout}">
		<span class="alert alert-info">You have logged out successfully!</span>
	</div>
	
    <div class="form-floating">
      <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com">
      <label for="email">Email address</label>
    </div>
    <div class="form-floating">
      <input type="password" class="form-control" id="password" name="password" placeholder="Password">
      <label for="password">Password</label>
    </div>

    <div class="checkbox mb-3">
      <label>
        <input type="checkbox" value="remember-me"> Remember me
      </label>
    </div>
    <button class="w-100 btn btn-lg btn-success" type="submit">Login</button>
    <div class="form-floating">
    	<span>New User?<a href="/" th:href="@{/registration}">Register here</a></span>
    </div>
    <p class="mt-5 mb-3 text-muted">&copy; 2024–2025</p>
  </form>
</main>


    
  </body>
</html>
